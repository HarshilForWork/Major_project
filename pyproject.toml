[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-pd"
version = "0.1.0"
description = "Temporal Reasoning and Confidence Explanation for Parkinson's Disease -- TD/PIGD motor subtype classification on PPMI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
docs = ["python-docx>=1.1", "python-pptx>=1.0", "reportlab>=4.0"]
dev  = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
